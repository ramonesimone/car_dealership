<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&C AUTOS Chatbot</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: #0f1219; color: #e1e4ed; height: 100vh; display: flex;
    flex-direction: column;
  }
  .header {
    background: linear-gradient(135deg, #1a1f2e 0%, #0f1219 100%);
    border-bottom: 1px solid #2a2f3e; padding: 16px 24px;
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  .header .logo {
    width: 40px; height: 40px; background: #e63946; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px; color: #fff; flex-shrink: 0;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header .subtitle { font-size: 12px; color: #8a8fa8; margin-top: 1px; }
  .header .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8a8fa8; }
  .header .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
  .chat-container {
    flex: 1; overflow-y: auto; padding: 20px 24px; display: flex;
    flex-direction: column; gap: 16px;
  }
  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-track { background: transparent; }
  .chat-container::-webkit-scrollbar-thumb { background: #2a2f3e; border-radius: 3px; }
  .message { display: flex; gap: 10px; max-width: 800px; animation: fadeIn 0.3s ease; }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .message .avatar {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
  }
  .message.assistant .avatar { background: #e63946; color: #fff; }
  .message.user .avatar { background: #3b82f6; color: #fff; }
  .message .bubble {
    padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px;
    word-wrap: break-word; max-width: 85%;
  }
  .message.assistant .bubble {
    background: #1a1f2e; border: 1px solid #2a2f3e; border-bottom-left-radius: 4px;
  }
  .message.user .bubble {
    background: #3b82f6; color: #fff; border-bottom-right-radius: 4px;
  }
  .message .bubble p { margin-bottom: 8px; }
  .message .bubble p:last-child { margin-bottom: 0; }
  .message .bubble ul, .message .bubble ol { margin: 8px 0; padding-left: 20px; }
  .message .bubble li { margin-bottom: 4px; }
  .message .bubble strong { color: inherit; }
  .message.user .bubble strong { color: #fff; }
  .sources { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .source-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: #2a2f3e; color: #8a8fa8; border: 1px solid #353a4a;
  }
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%; background: #8a8fa8;
    animation: typing 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }
  .input-area {
    border-top: 1px solid #2a2f3e; padding: 16px 24px; flex-shrink: 0;
    background: #0f1219;
  }
  .input-row { display: flex; gap: 10px; max-width: 800px; margin: 0 auto; }
  .input-row input {
    flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a2f3e;
    background: #1a1f2e; color: #e1e4ed; font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .input-row input::placeholder { color: #5a5f7a; }
  .input-row input:focus { border-color: #e63946; }
  .input-row button {
    padding: 12px 24px; border-radius: 10px; border: none;
    background: #e63946; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.2s; white-space: nowrap;
  }
  .input-row button:hover { background: #d62839; }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .lang-select {
    background: #1a1f2e; color: #e1e4ed; border: 1px solid #2a2f3e;
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;
    outline: none; margin-left: auto;
  }
  .lang-select:focus { border-color: #e63946; }
  .agent-select {
    background: #1a1f2e; color: #e1e4ed; border: 1px solid #2a2f3e;
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;
    outline: none;
  }
  .agent-select:focus { border-color: #e63946; }
  .agent-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 4px; margin-bottom: 8px; letter-spacing: 0.3px;
  }
  .agent-badge.bob { background: #9333ea22; color: #c084fc; border: 1px solid #9333ea44; }
  .agent-badge.june { background: #22c55e22; color: #4ade80; border: 1px solid #22c55e44; }
  .image-gallery { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .image-gallery img {
    width: 100%; max-width: 180px; height: 120px; object-fit: cover;
    border-radius: 8px; border: 1px solid #2a2f3e;
    transition: transform 0.2s, border-color 0.2s; cursor: pointer;
  }
  .image-gallery img:hover { transform: scale(1.03); border-color: #e63946; }
  .image-gallery img.loading { opacity: 0.5; }
  @media (max-width: 600px) { .image-gallery img { max-width: 140px; height: 100px; } }
  .welcome {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; text-align: center; padding: 40px 20px;
  }
  .welcome .icon { font-size: 48px; margin-bottom: 16px; }
  .welcome h2 { font-size: 22px; margin-bottom: 8px; }
  .welcome p { color: #8a8fa8; max-width: 500px; line-height: 1.6; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; justify-content: center; }
  .suggestions button {
    padding: 8px 16px; border-radius: 20px; border: 1px solid #2a2f3e;
    background: #1a1f2e; color: #8a8fa8; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .suggestions button:hover { border-color: #e63946; color: #e1e4ed; }
  pre { background: #0a0d14; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  code { font-family: 'SF Mono', 'Fira Code', monospace; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">TC</div>
  <div>
    <h1>T&amp;C AUTOS</h1>
    <div class="subtitle">Silicon Valley's Premier Dealership</div>
  </div>
  <select class="agent-select" id="agentSelect">
    <option value="june">June &nbsp;&#9889; Fast</option>
    <option value="bob">Bob &nbsp;&#128422; Slow</option>
  </select>
  <select class="lang-select" id="langSelect" onchange="onLangChange()">
    <option value="auto">Auto Detect</option>
    <option value="en">English</option>
    <option value="fr">Fran&ccedil;ais</option>
    <option value="es">Espa&ntilde;ol</option>
    <option value="de">Deutsch</option>
    <option value="nl">Nederlands</option>
    <option value="pt">Portugu&ecirc;s</option>
    <option value="ru">Русский</option>
    <option value="hi">हिन्दी</option>
    <option value="bn">বাংলা</option>
    <option value="zh-cn">中文</option>
    <option value="ar">العربية</option>
    <option value="ur">اردو</option>
  </select>
  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connected</span>
  </div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcome">
    <div class="icon">🚗</div>
    <h2>Welcome to T&amp;C AUTOS</h2>
    <p>I'm Alex, your virtual sales assistant. Ask me about our vehicles, services, financing, or anything else about our dealership.</p>
    <div class="suggestions">
      <button onclick="sendSuggestion('What SUVs do you have under $40,000?')">What SUVs under $40K?</button>
      <button onclick="sendSuggestion('How much is an oil change?')">Oil change price</button>
      <button onclick="sendSuggestion('What are your current lease specials?')">Lease specials</button>
      <button onclick="sendSuggestion('What are your business hours?')">Business hours</button>
      <button onclick="sendSuggestion('Do you offer financing for first-time buyers?')">First-time financing</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <input type="text" id="input" placeholder="Ask about vehicles, services, financing..." autofocus>
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const chatContainer = document.getElementById('chatContainer');
const input = document.getElementById('input');
const welcome = document.getElementById('welcome');
const langSelect = document.getElementById('langSelect');
const agentSelect = document.getElementById('agentSelect');
const history = [];
let processing = false;

function currentLang() { return langSelect ? langSelect.value : 'auto'; }
function currentAgent() { return agentSelect ? agentSelect.value : 'june'; }
function onLangChange() { /* language preference stored in selector */ }

input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

function addMessage(role, content, sources, agent, images) {
  welcome?.remove();
  const div = document.createElement('div');
  div.className = 'message ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'assistant' ? 'A' : 'U';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'assistant' && agent) {
    const badge = document.createElement('div');
    badge.className = 'agent-badge ' + agent;
    const names = { bob: 'Bob \u{1F422} Slow', june: 'June \u26A1 Fast' };
    badge.textContent = names[agent] || 'Alex';
    bubble.appendChild(badge);
  }

  bubble.innerHTML += formatContent(content);

  if (images && images.length > 0) {
    const gallery = document.createElement('div');
    gallery.className = 'image-gallery';
    images.forEach(img => {
      const imgEl = document.createElement('img');
      imgEl.loading = 'lazy';
      imgEl.className = 'loading';
      imgEl.alt = img.year + ' ' + img.make + ' ' + img.model;
      imgEl.onload = function () { this.className = ''; };
      imgEl.onerror = function () { this.remove(); };
      imgEl.src = img.url;
      gallery.appendChild(imgEl);
    });
    bubble.appendChild(gallery);
  }

  if (sources && sources.length > 0) {
    const srcDiv = document.createElement('div');
    srcDiv.className = 'sources';
    const seen = new Set();
    sources.forEach(s => {
      if (!seen.has(s.source)) {
        seen.add(s.source);
        const badge = document.createElement('span');
        badge.className = 'source-badge';
        badge.textContent = s.source.replace('.md', '').replace(/^\d+_/, '');
        srcDiv.appendChild(badge);
      }
    });
    bubble.appendChild(srcDiv);
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function formatContent(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  welcome?.remove();
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typingIndicator';
  const avatar = document.createElement('div');
  avatar.className = 'avatar'; avatar.textContent = 'A';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(avatar); div.appendChild(bubble);
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || processing) return;
  input.value = '';
  processing = true;
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(-6), language: currentLang(), agent: currentAgent() }),
    });
    const data = await res.json();
    removeTyping();
    addMessage('assistant', data.reply, data.sources, data.agent, data.images);
    history.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    removeTyping();
    addMessage('assistant', 'Sorry, I had trouble connecting. Please make sure the server is running.');
  }
  processing = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function sendSuggestion(text) {
  input.value = text;
  sendMessage();
}

async function checkHealth() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    if (data.status === 'ok') {
      document.getElementById('statusDot').style.background = '#4ade80';
      document.getElementById('statusText').textContent = 'Connected';
    }
  } catch { /* ignore */ }
}
checkHealth();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
